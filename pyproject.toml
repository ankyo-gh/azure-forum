[project]
name = "afterschool-board"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "flask>=3.1,<4",
  "flask-wtf>=1.2,<2",
  "gunicorn>=23,<24; sys_platform != 'win32'",
  "pillow>=12,<13",
  "azure-data-tables>=12.7,<13",
  "azure-storage-blob>=12.27,<13",
  "azure-identity>=1.25,<2",
  "python-dotenv>=1.2,<2",
  "tzdata>=2025.2",
]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.14,<1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
