name: Test and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: npm ci
      - run: npm run build:css
      - name: Export locked runtime requirements
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file requirements.txt > /dev/null
          git diff --exit-code -- requirements.txt
      - run: uv run python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: dist/app.zip
          retention-days: 3

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: afterschool-board-ankyo
          package: app.zip
      - name: Restart application to load the deployed build
        run: az webapp restart --resource-group rg-afterschool-board --name afterschool-board-ankyo
      - name: Verify deployed application
        run: python3 scripts/verify_deployment.py https://afterschool-board-ankyo.azurewebsites.net --package app.zip
