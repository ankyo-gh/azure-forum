<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}放課後ボード{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</head>
<body class="board antialiased">
  <a class="skip-link sr-only focus:not-sr-only" href="#main">本文へ移動</a>
  <header class="board-header">
    <div class="board-width flex items-center justify-between gap-4 px-4 py-5">
      <a class="brand text-xl font-bold tracking-tight" href="{{ url_for('board.index') }}">放課後ボード<span class="mt-1 block board-muted text-xs font-normal tracking-widest">AFTER SCHOOL BOARD</span></a>
      <a class="button" href="{{ url_for('board.new_post') }}">＋ 投稿する</a>
    </div>
  </header>
  <main id="main" class="board-width min-h-[70vh] py-8 sm:py-12">
    {% for message in get_flashed_messages() %}<p role="status" class="flash-note mb-6">{{ message }}</p>{% endfor %}
    {% block content %}{% endblock %}
  </main>
  <footer class="board-width board-footer py-6 text-sm leading-6">
    <p>放課後ボード · 学校課題用の実証環境</p>
    <p>本名・学校名・住所などの個人情報や、他人の写真を無断で投稿しないでください。</p>
  </footer>
</body>
</html>
